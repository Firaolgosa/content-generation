[project]
name = "heritage-short"
version = "0.1.0"
description = "Storyboard-driven pipeline that turns storyboard.json into a narrated, scored 60-90s short film."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "python-dotenv>=1.0",
    "pillow>=10.3",
    "kaggle>=1.7",
    "six>=1.17.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long f-strings in filter graphs read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
